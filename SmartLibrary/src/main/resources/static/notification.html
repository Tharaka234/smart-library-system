<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Notifications</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #e2e8f0;
            --accent: #38bdf8;
        }
        body {
            font-family: "Poppins", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 60px;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .notification-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 15px;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .notification-item:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.1);
        }
        .loading {
            text-align: center;
            opacity: 0.7;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔔 My Notifications</h1>

    <div id="notificationList" class="card">
        <p class="loading">Loading notifications...</p>
    </div>
</div>

<script>
    const USER_ID = 1; // Dynamically set after login if available
    const API_URL = `http://localhost:8081/api/notifications/${USER_ID}`;

    async function loadNotifications() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();

            const container = document.getElementById("notificationList");
            container.innerHTML = "";

            if (!data || data.length === 0) {
                container.innerHTML = "<p class='loading'>No notifications yet.</p>";
                return;
            }

            data.forEach((n) => {
                const note = document.createElement("div");
                note.classList.add("notification-item");
                note.innerHTML = `📢 ${n.message} <br><small>${new Date(
                    n.createdAt
                ).toLocaleString()}</small>`;
                container.appendChild(note);
            });
        } catch (err) {
            console.error("Error loading notifications:", err);
            document.getElementById("notificationList").innerHTML =
                "<p class='loading'>Failed to load notifications.</p>";
        }
    }

    loadNotifications();
</script>
</body>
</html>
