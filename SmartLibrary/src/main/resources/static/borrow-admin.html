<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Borrow Management | Smart Library</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --glass: rgba(255, 255, 255, 0.15);
            --glass-dark: rgba(255, 255, 255, 0.25);
            --text: #f8fafc;
            --text-muted: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Background Video */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            filter: brightness(40%);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-dark);
            border-radius: 20px;
            padding: 30px;
            color: var(--text);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #fff, #e0f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            justify-content: center;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-input {
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            font-size: 14px;
            backdrop-filter: blur(10px);
        }

        .filter-input::placeholder {
            color: var(--text-muted);
        }

        .filter-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.15);
        }

        .table-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: transparent;
        }

        th {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            color: var(--text);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            font-size: 14px;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-returned {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .status-overdue {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 8px;
        }

        .form-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .form-container {
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-dark);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            color: var(--text);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.3s ease;
        }

        .form-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 25px;
        }

        .form-header h3 {
            font-size: 22px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            font-size: 14px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .controls, .filters {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                flex-direction: column;
            }

            .table-container {
                overflow-x: auto;
            }

            table {
                min-width: 800px;
            }
        }
    </style>
</head>
<body>
<!-- Background Video -->
<video autoplay muted loop id="bgVideo">
    <source src="video3.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="container">
    <div class="header">
        <h2>📘 Borrow Management</h2>
        <p>Admin Panel - Manage book borrows and returns</p>
    </div>

    <div class="controls">
        <button class="btn btn-secondary" onclick="goToBooks()">
            📚 Books Management
        </button>
        <button class="btn btn-primary" onclick="loadBorrows()">
            🔄 Refresh All
        </button>
        <button class="btn btn-success" onclick="showBorrowForm()">
            ➕ New Borrow
        </button>
        <button class="btn btn-warning" onclick="showOverdueDueDate()">
            ⚠️ Current Overdue
        </button>
        <button class="btn btn-warning" onclick="showOverdueReturnDate()">
            📅 Returned Late
        </button>
        <button class="btn btn-secondary" onclick="showStats()">
            📊 View Statistics
        </button>
    </div>

    <div class="filters">
        <div class="filter-group">
            <input type="number" class="filter-input" id="filterUserId" placeholder="Filter by User ID">
            <button class="btn btn-primary btn-sm" onclick="filterByUser()">Apply</button>
        </div>
        <div class="filter-group">
            <input type="number" class="filter-input" id="filterBookId" placeholder="Filter by Book ID">
            <button class="btn btn-primary btn-sm" onclick="filterByBook()">Apply</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>User</th>
                <th>Book</th>
                <th>Borrow Date</th>
                <th>Due Date</th>
                <th>Return Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="borrowBody">
            <tr>
                <td colspan="8" class="empty-state">
                    <div>📖</div>
                    <p>No borrow records found</p>
                    <button class="btn btn-primary" onclick="showBorrowForm()" style="margin-top: 15px;">
                        Create First Borrow
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add Borrow Form -->
<div class="form-overlay" id="borrowFormOverlay">
    <div class="form-container">
        <div class="form-header">
            <h3>➕ New Borrow Record</h3>
            <button class="close-btn" onclick="hideBorrowForm()">×</button>
        </div>

        <div class="form-group">
            <label class="form-label">User ID</label>
            <input type="number" class="form-input" id="userId" placeholder="Enter User ID" required>
        </div>

        <div class="form-group">
            <label class="form-label">Book ID</label>
            <input type="number" class="form-input" id="bookId" placeholder="Enter Book ID" required>
        </div>

        <div class="form-group">
            <label class="form-label">Borrow Date</label>
            <input type="date" class="form-input" id="borrowDate" required>
        </div>

        <div class="form-group">
            <label class="form-label">Due Date (Optional)</label>
            <input type="date" class="form-input" id="dueDate" placeholder="Select due date">
        </div>

        <div class="form-actions">
            <button class="btn btn-success" onclick="addBorrow()" style="flex: 1;">
                💾 Save Borrow
            </button>
            <button class="btn btn-secondary" onclick="hideBorrowForm()">
                Cancel
            </button>
        </div>
    </div>
</div>

<script src="borrow-admin.js"></script>
<script>
    // Set today's date as default for borrow date
    document.getElementById('borrowDate').valueAsDate = new Date();
</script>
</body>
</html>
